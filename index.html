<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F2F7">
<title>Vokabeln</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#F2F2F7;color:#1c1c1e;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea,button{font-family:inherit;font-size:17px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.view{flex:1;overflow-y:auto;padding:6px 16px 16px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
h1{font-size:32px;margin:6px 0 14px;font-weight:700;letter-spacing:-.5px}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 16px 4px}
.tile,.circ{width:38px;height:38px;border:0;background:#fff;color:#007AFF;display:flex;align-items:center;justify-content:center;padding:0;margin:0}
.tile,.circ{border-radius:50%}
.tile:active,.circ:active{background:#e5e5ea}
.tile:active{background:#e5e5ea}
#menuBg{position:fixed;inset:0;z-index:40;display:none}
#menu{position:fixed;z-index:41;display:none;top:calc(env(safe-area-inset-top) + 54px);right:16px;min-width:230px;background:rgba(255,255,255,.97);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.22);overflow:hidden}
#menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;font-size:17px;color:#1c1c1e;border-bottom:1px solid #e5e5ea}
#menu button:last-child{border-bottom:0}
#menu button:active{background:#e5e5ea}
.tabbar{display:flex;background:rgba(249,249,249,.94);border-top:1px solid #d1d1d6;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
.tab{flex:1;border:0;background:none;color:#8e8e93;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#007AFF}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.box{background:#fff;border-radius:12px;padding:10px 4px;text-align:center}
.box b{display:block;font-size:22px}
.box span{font-size:11px;color:#8e8e93}
.box i{display:block;font-style:normal;font-size:11px;color:#007AFF;min-height:14px;margin-top:2px}
.seg{display:flex;background:#e3e3e8;border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 2px;font-size:13px;color:#1c1c1e}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;background:#007AFF;color:#fff;font-weight:600}
.btn:disabled{background:#c7c7cc}
.btn.sec{background:#fff;color:#007AFF}
.btn.red{background:#fff;color:#FF3B30}
.pill{border:0;background:#fff;color:#007AFF;border-radius:20px;padding:8px 14px;font-size:15px}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{width:100%;border:0;background:#e3e3e8;border-radius:10px;padding:9px 12px;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.list{background:#fff;border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid #e5e5ea;gap:10px}
.item:last-child{border:0}
.item:active{background:#f2f2f7}
.item .t{min-width:0}
.item .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:#8e8e93;font-size:15px}
.badge{font-size:12px;color:#8e8e93;white-space:nowrap}
.empty{text-align:center;color:#8e8e93;padding:30px 10px}
/* Lernen */
#learn{position:fixed;inset:0;background:#F2F2F7;z-index:20;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);max-width:560px;margin:0 auto}
#learn.on{display:flex}
.lhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#8e8e93;margin-bottom:12px}
#lundo{justify-self:start}
#lend{justify-self:end}
.skip{border:0;background:none;color:#8e8e93;font-size:15px;padding:12px;margin-top:4px}
.lhead button{border:0;background:none;color:#007AFF;font-size:17px;padding:4px 0}
.prog{height:4px;background:#e3e3e8;border-radius:2px;margin-bottom:16px}
.prog div{height:100%;background:#007AFF;border-radius:2px;width:0;transition:width .25s}
.flash{flex:1;background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;box-shadow:0 2px 12px rgba(0,0,0,.06);min-height:0;overflow:auto}
.flash .q{font-size:30px;font-weight:600;word-break:break-word}
.flash .a{font-size:26px;color:#007AFF;word-break:break-word;border-top:1px solid #e5e5ea;padding-top:18px;width:100%}
.flash .hint{color:#8e8e93;font-size:14px}
.lbtns{display:flex;gap:12px;margin-top:14px;min-height:54px}
.lbtns .btn{flex:1}
.lbtns .no{background:#FFE5E3;color:#D70015}
.lbtns .yes{background:#DDF5E0;color:#1E7B34}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.done .big{font-size:56px}
/* Sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.sheet{background:#F2F2F7;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h2{margin:0 0 12px;font-size:19px;text-align:center}
.sheet input,.sheet textarea{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;margin-bottom:10px;background:#fff;-webkit-user-select:text;user-select:text}
.sheet textarea{height:160px;resize:none}
.sheet .note{font-size:13px;color:#8e8e93;margin:0 4px 10px}
.sheet .row{margin:0}
.sheet .row .btn{flex:1}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="circ" id="add" aria-label="Neue Vokabel" style="visibility:hidden"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></button>
    <button class="tile" id="more" aria-label="Mehr"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="4.5" cy="11" r="2" fill="currentColor"/><circle cx="11" cy="11" r="2" fill="currentColor"/><circle cx="17.5" cy="11" r="2" fill="currentColor"/></svg></button>
  </div>

  <!-- Lernen -->
  <div class="view on" id="v-home">
    <div class="boxes" id="boxes"></div>
    <div class="seg" id="dir">
      <button data-d="fw">Wort → Übers.</button>
      <button data-d="bw">Übers. → Wort</button>
      <button data-d="mix">Beide</button>
    </div>
    <button class="btn" id="start">Lernen starten</button>
    <p class="note" id="homeNote" style="text-align:center;color:#8e8e93;font-size:14px;margin-top:12px"></p>
  </div>

  <!-- Vokabeln -->
  <div class="view" id="v-words">
    <h1>Vokabeln</h1>
    <input class="search" id="q" type="search" placeholder="Suchen" autocomplete="off" autocapitalize="off">
    <div class="list" id="list"></div>
    <div style="height:14px"></div>
    <button class="btn red" id="reset">Fortschritt zurücksetzen</button>
  </div>

  <nav class="tabbar">
    <button class="tab on" data-v="home">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 11h18M10 14.5h4"/></svg>Lernen</button>
    <button class="tab" data-v="words">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Vokabeln</button>
  </nav>
</div>

<!-- Lernansicht -->
<div id="learn">
  <div class="lhead"><button id="lundo" style="visibility:hidden"><svg width="12" height="20" viewBox="0 0 12 20" style="vertical-align:-4px;margin-right:3px"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Zurück</button><span id="lcount"></span><button id="lend">Beenden</button></div>
  <div class="prog"><div id="lbar"></div></div>
  <div id="lbody" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>

<!-- Menü -->
<div id="menuBg"></div>
<div id="menu">
  <button id="m-imp"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Importieren</button>
  <button id="m-exp"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Exportieren</button>
</div>

<!-- Sheet -->
<div id="sheet"><div class="sheet" id="sheetBox"></div></div>

  });
  return out;
}
function topUp(){
  DIRS.forEach(function(d){
    var cnt=state.cards.filter(function(c){return c.k[d].r&&c.k[d].b===1;}).length;
    if(cnt>=WINDOW)return;
    var wait=state.cards.filter(function(c){return !c.k[d].r;}).sort(function(a,b){return a.n-b.n;});
    for(var i=0;i<wait.length&&cnt<WINDOW;i++){var s=wait[i].k[d];s.r=true;s.b=1;s.d=today();cnt++;}
  });
}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.cards))state=s;}catch(e){}
  if(!state.dir)state.dir='fw';
  if(!Array.isArray(state.seeded))state.seeded=[];
  state.cards.forEach(function(c){c.b=String(c.b).replace(/^hier:\s*/i,'');});
  var nmap={},cnt=0;
  SEEDS.forEach(function(s){s[1].forEach(function(r){var k=r[0]+'|'+r[1];if(!(k in nmap))nmap[k]=cnt;cnt++;});});
  state.cards.forEach(function(c){
    if(c.n===undefined){var k=c.f+'|'+c.b;c.n=(k in nmap)?nmap[k]:null;}
    if(c.unw===undefined)c.unw=(c.n!==null&&c.n!==Math.floor(c.n))?1:0;
    if(!c.k){
      var rel=(c.rel!==undefined)?c.rel:((c.n===null)||c.box>1||c.r3===true);
      c.k={fw:{b:c.box||1,d:c.due||today(),r:rel},bw:{b:1,d:today(),r:c.n===null}};
      delete c.box;delete c.due;delete c.rel;delete c.r3;delete c.u;
    }
  });
  var off=0;
  SEEDS.forEach(function(s){
    if(state.seeded.indexOf(s[0])<0){
      s[1].forEach(function(r,i){state.cards.push(newCard(r[0],r[1],off+i,false));});
      state.seeded.push(s[0]);
    }
    off+=s[1].length;
  });
  topUp();
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return fmt(new Date());}
function inDays(n){var d=new Date();d.setDate(d.getDate()+n);return fmt(d);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nowStr(){var d=new Date();return fmt(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function nextDueText(){
  var best=null;
  state.cards.forEach(function(c){curDirs().forEach(function(d){var s=c.k[d];if(s.r&&(best===null||s.d<best))best=s.d;});});
  if(!best)return '';
  var day=best.slice(0,10),t=best.length>10?best.slice(11,16):'';
  var tm=new Date();tm.setDate(tm.getDate()+1);
  var when=day===today()?'heute':day===fmt(tm)?'morgen':day.slice(8,10)+'.'+day.slice(5,7)+'.';
  return ' Nächste Karten: '+when+(t&&day===today()?' ab '+t:'')+'.';
}

/* Import / Export */
function parseTable(text){
  text=text.replace(/^﻿/,'');
  var first=(text.split(/\r?\n/).filter(function(l){return l.trim();})[0])||'';
  var delim=first.indexOf('\t')>-1?'\t':first.indexOf(';')>-1?';':first.indexOf('=')>-1?'=':',';
  var rows=[],row=[],cell='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}
      else cell+=ch;
    }else if(ch==='"'&&cell===''){q=true;}
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      row.push(cell);cell='';rows.push(row);row=[];
    }else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(function(r){return r.length>1&&(r[0]||'').trim()&&(r[1]||'').trim();});
}
function importText(text){
  var rows=parseTable(text);
  if(rows.length){ // Kopfzeile überspringen
    var a=rows[0][0].trim().toLowerCase(),b=rows[0][1].trim().toLowerCase();
    if(/^(wort|vokabel|begriff|vorderseite|word|italienisch)$/.test(a)&&/^(übersetzung|ubersetzung|deutsch|rückseite|translation)$/.test(b))rows.shift();
  }
  var have={};
  state.cards.forEach(function(c){have[c.f.toLowerCase()+'|'+c.b.toLowerCase()]=1;});
  var added=0,dup=0;
  rows.forEach(function(r){
    var f=r[0].trim(),b=r[1].trim().replace(/^hier:\s*/i,'');
    if(!f||!b)return;
    var k=f.toLowerCase()+'|'+b.toLowerCase();
    if(have[k]){dup++;return;}
    have[k]=1;
    state.imp=(state.imp||0)+1;
    state.cards.push(newCard(f,b,1000+state.imp,false)); // hinten anstellen, rückt nach
    added++;
  });
  topUp();save();render();
  return {added:added,dup:dup};
}
function decode(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch(e){return new TextDecoder('windows-1252').decode(buf);}
}
function openImport(){
  openSheet('<h2>Importieren</h2>'
    +'<label class="btn sec" style="text-align:center;margin-bottom:10px">CSV-Datei wählen<input type="file" id="ifile" accept=".csv,.txt,text/csv,text/plain" style="display:none"></label>'
    +'<p class="note">Oder Text einfügen: eine Vokabel pro Zeile, Wort und Übersetzung getrennt durch Semikolon, Komma, Tabulator oder „=“. Weitere Spalten werden ignoriert, eine Kopfzeile wird übersprungen.</p>'
    +'<textarea id="it" placeholder="haus;house&#10;Hund;dog" autocapitalize="none"></textarea>'
    +'<div class="row"><button class="btn sec" id="ic">Abbrechen</button><button class="btn" id="ii">Importieren</button></div>');
  $('ic').onclick=closeSheet;
  $('ifile').onchange=function(){
    var f=this.files&&this.files[0];if(!f)return;

  };

    alert(r.added?r.added+' neue Vokabeln importiert'+(r.dup?', '+r.dup+' schon vorhanden.':'.'):(r.dup?'Alle '+r.dup+' Vokabeln sind schon vorhanden.':'Keine gültigen Zeilen gefunden.'));
  };
};
function exportCsv(){
  if(!state.cards.length){alert('Keine Vokabeln vorhanden.');return;}
  var csv='Wort;Übersetzung;Fach W→Ü;Fällig W→Ü;Fach Ü→W;Fällig Ü→W\n'+state.cards.map(function(c){
    return [c.f,c.b,c.k.fw.b,c.k.fw.d,c.k.bw.b,c.k.bw.d].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(';');
  }).join('\n');
  saveFile('vokabeln.csv','text/csv','\ufeff'+csv);
};
function saveFile(name,type,content){
  var file=null;
  try{file=new File([content],name,{type:type});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(function(){});
    return;
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:type}));a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function backupSave(){saveFile('vokabeln-sicherung-'+today()+'.json','application/json',JSON.stringify(state));}
function backupLoad(f){
  var rd=new FileReader();

    try{d=JSON.parse(decode(rd.result));}catch(e){}
    if(!d||!Array.isArray(d.cards)||!d.cards.every(function(c){return c&&typeof c.f==='string'&&typeof c.b==='string';})){alert('Das ist keine gültige Sicherung.');return;}
    if(!confirm('Aktuellen Stand durch die Sicherung ersetzen? ('+d.cards.length+' Karten)'))return;
    try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}
    load();render();
    alert('Sicherung geladen.');
  };
  rd.readAsArrayBuffer(f);
}

  }

/* Lernen */
var S=null;
$('start').onclick=function(){
  var due=dueEntries();if(!due.length)return;
  var by={},pick=[];
  due.forEach(function(x){(by[x.c.id]=by[x.c.id]||[]).push(x);});
  due.forEach(function(x){var l=by[x.c.id];if(l){pick.push(l[Math.floor(Math.random()*l.length)]);by[x.c.id]=null;}});
  due=pick;
  S={hist:[],queue:due.map(function(x){return{c:x.c,d:x.d,retry:false,rev:x.d==='bw'};}),total:due.length,done:0,right:0,flipped:false};
  $('learn').classList.add('on');
  showCard();
};
$('lend').onclick=function(){$('learn').classList.remove('on');S=null;render();};

function showCard(){
  var body=$('lbody');
  $('lundo').style.visibility=S.hist.length?'visible':'hidden';
  $('lbar').style.width=(S.total?S.done/S.total*100:0)+'%';
  $('lcount').textContent=Math.min(S.done+1,S.total)+' / '+S.total;
  if(!S.queue.length){
    $('lcount').textContent='';
    body.innerHTML='<div class="done"><div class="big">🎉</div><h2 style="margin:0">Geschafft!</h2>'
      +'<div style="color:#8e8e93">'+S.right+' von '+S.total+' gewusst</div></div>'
      +'<div class="lbtns"><button class="btn" id="fin">Fertig</button></div>';
    $('fin').onclick=$('lend').onclick;
    return;
  }
  var it=S.queue[0];S.flipped=false;
  var q=it.rev?it.c.b:it.c.f;
  body.innerHTML='<div class="flash" id="fl"><div class="q">'+esc(q)+'</div><div class="hint">Zum Umdrehen tippen</div></div>'
    +'<div class="lbtns" id="lb"></div><button class="skip" id="sk">Unwichtig</button>';
  $('fl').onclick=flip;
  $('sk').textContent=(it.c.unw>=1)?'Unwichtig · Karte löschen':'Unwichtig';
  $('sk').onclick=markUnimportant;
}
function flip(){
  if(S.flipped)return;S.flipped=true;
  var it=S.queue[0],a=it.rev?it.c.f:it.c.b;
  var fl=$('fl');
  fl.innerHTML='<div class="q">'+esc(it.rev?it.c.b:it.c.f)+'</div><div class="a">'+esc(a)+'</div>';
  $('lb').innerHTML='<button class="btn no" id="no">Nicht gewusst</button><button class="btn yes" id="yes">Gewusst</button>';
  $('no').onclick=function(){answer(false);};
  $('yes').onclick=function(){answer(true);};
}
function answer(ok){
  var it=S.queue.shift(),s=it.c.k[it.d];
  S.hist.push({it:it,b:s.b,d:s.d,ok:ok,done:S.done,right:S.right});
  if(ok){
    s.b=Math.min(5,s.b+1); // Fach hoch
    s.d=inDays(INTERVALS[s.b]);
    S.right++;
  }else{
    s.b=1;s.d=today(); // zurück in Fach 1, sofort wieder fällig (in der nächsten Session)
  }
  S.done++;
  topUp();save();showCard();
}
function markUnimportant(){
  if(!S||!S.queue.length)return;
  var c=S.queue[0].c;
  var snap={c:c,n:c.n,k:JSON.parse(JSON.stringify(c.k)),seq:state.seq,unw:c.unw||0};
  var removed=[],rest=[];
  S.queue.forEach(function(x){(x.c===c?removed:rest).push(x);});
  S.queue=rest;S.total-=removed.length;
  if((c.unw||0)>=1){ // zum zweiten Mal unwichtig: Karte löschen
    var idx=state.cards.indexOf(c);
    if(idx>-1)state.cards.splice(idx,1);
    var waiting0=[];
    state.cards.forEach(function(x){DIRS.forEach(function(d){if(!x.k[d].r)waiting0.push([x,d]);});});
    topUp();
    var newly0=waiting0.filter(function(w){return w[0].k[w[1]].r;});
    S.hist.push({skip:true,del:true,idx:idx,snap:snap,removed:removed,newly:newly0});
    save();showCard();return;
  }
  c.unw=1;
  var un=(c.n===null)?undefined:UNIT_BY_N[Math.floor(c.n)];
  var base=(un===undefined)?1e6:UMAX[un]+0.5;
  state.seq=(state.seq||0)+1;
  c.n=base+state.seq*1e-6;
  DIRS.forEach(function(d){var s=c.k[d];s.r=false;s.b=1;s.d=today();});
  var waiting=[];
  state.cards.forEach(function(x){DIRS.forEach(function(d){if(!x.k[d].r)waiting.push([x,d]);});});
  topUp();
  var newly=waiting.filter(function(w){return w[0]!==c&&w[0].k[w[1]].r;});
  S.hist.push({skip:true,snap:snap,removed:removed,newly:newly});
  save();showCard();
}
function undo(){
  var x=S&&S.hist.pop();if(!x)return;
  if(x.skip){
    var c=x.snap.c;
    if(x.del)state.cards.splice(Math.min(x.idx,state.cards.length),0,c);
    c.n=x.snap.n;c.k=x.snap.k;state.seq=x.snap.seq;c.unw=x.snap.unw;
    x.newly.forEach(function(w){w[0].k[w[1]].r=false;});
    S.total+=x.removed.length;S.queue=x.removed.concat(S.queue);
    save();showCard();flip();return;
  }
  var it=x.it,s=it.c.k[it.d];
  s.b=x.b;s.d=x.d;S.done=x.done;S.right=x.right;
  S.queue.unshift(it);
  save();showCard();flip();
}
$('lundo').onclick=undo;

load();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
